:root{
  --bg:#F4F0E4; --card:#FBF8EF; --text:#2B2A25; --text-soft:#6A6558; --rule:#CFC6B2;
  --accent:#234F3C; --on-accent:#FBF4E4; --tint:#E6ECDF;
  --good:#2A7655; --good-bg:#E1EEE4;
  /* 顏料色：插畫本身在兩種主題下都是同一幅畫 */
  --p-green:#234F3C; --p-green-2:#34694F; --p-green-3:#183A2B; --p-leaf:#6FA27C;
  --p-wall:#EADFCB; --p-wall-line:#CDBDA2; --p-walk:#D9CDB5;
  --p-glow:#F2D27E; --p-glow-2:#F8E6AE; --p-gold:#C9A56A;
  --p-path:#F3E9D5; --p-path-edge:#D8C6A4;
  --p-pink:#E58CA3; --p-pink-2:#F6CCD4; --p-cream:#FBF4E4;
  --p-terra:#C9764F; --p-cat:#FFFDF7; --p-cat-line:#6B6152; --p-line:#2B2A25;
  --p-skin:#F3D9D0; --p-skin-rim:#DDB9AD;
  --f-disp:"Bodoni Moda","Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141C18; --card:#1D2822; --text:#F0EADB; --text-soft:#B3AD9C; --rule:#3A473F;
    --accent:#EBD9A0; --on-accent:#17251D; --tint:#26342C;
    --good:#86D3AD; --good-bg:#1D3A2D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141C18; --card:#1D2822; --text:#F0EADB; --text-soft:#B3AD9C; --rule:#3A473F;
  --accent:#EBD9A0; --on-accent:#17251D; --tint:#26342C;
  --good:#86D3AD; --good-bg:#1D3A2D;

}

*{box-sizing:border-box}
body{font:400 16px/1.65 var(--f-body);color:var(--text);background:var(--bg)}

}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance}

.brand{display:block;font:500 11px/1.3 var(--f-body);letter-spacing:.22em;color:var(--text-soft);margin-bottom:2px}
h1{font-size:23px;font-weight:900;line-height:1.15;color:var(--text)}
.lv{font:700 14px/1.3 var(--f-disp);color:var(--accent);padding-bottom:2px}
.top-skin{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.face{width:56px;height:56px;display:block;overflow:visible}
.petal{fill:var(--card);stroke:var(--rule);stroke-width:1.5;transition:fill .4s,stroke .4s}
.petal.on{fill:var(--p-pink);stroke:var(--p-pink)}
.f-skin{fill:var(--p-skin);stroke:var(--p-skin-rim);stroke-width:2}
.f-eye{fill:var(--p-line)}

.skin-info{display:grid;gap:7px;min-width:0}

.skin-now span:last-child{color:var(--text-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.p-wall{fill:var(--p-wall)}
.p-walk{fill:var(--p-walk)}

.b-cornice{fill:var(--p-walk)}
.b-shop{fill:var(--p-green)}
.b-dark{fill:var(--p-green-3)}

.b-glow{fill:var(--p-glow)}
.b-glow-2{fill:var(--p-glow-2);opacity:.75}
.b-name{font:700 10px var(--f-disp);letter-spacing:3.4px;fill:var(--p-cream)}
.c-pink{fill:var(--p-pink)} .c-pink2{fill:var(--p-pink-2)} .c-cream{fill:var(--p-cream)}
.c-green2{fill:var(--p-green-2)} .c-leaf{fill:var(--p-leaf)} .c-gold{fill:var(--p-gold)}
.c-terra{fill:var(--p-terra)} .c-line{fill:var(--p-line)}

.node .ring{fill:none;stroke:var(--p-cream);stroke-width:2.2;opacity:0;transform-box:fill-box;transform-origin:center}

.node .n-num{font:700 13px var(--f-disp);fill:var(--p-green-3)}

.c-out *{fill:var(--p-cat-line);stroke:var(--p-cat-line);stroke-linecap:round;stroke-linejoin:round}
.c-out .c-body{stroke-width:2}
.c-out .c-tail{fill:none;stroke-width:5.6}
.c-out .c-leg{stroke-width:5.2}
.c-fill .c-body{fill:var(--p-cat)}
.c-fill .c-tail{fill:none;stroke:var(--p-cat);stroke-width:3.6;stroke-linecap:round}
.c-fill .c-leg{stroke:var(--p-cat);stroke-width:3.2;stroke-linecap:round}

/* 內容 */
#content{display:grid;gap:14px}
.panel{background:var(--card);border:1px solid var(--text);outline:1px solid var(--rule);outline-offset:-5px;padding:20px 18px;display:grid;gap:10px;scroll-margin-top:140px}
.eyebrow{font:500 12px/1.3 var(--f-body);color:var(--accent);letter-spacing:.22em}
h2{font-size:22px;font-weight:900;line-height:1.4}
h2:focus{outline:none}
.sub{font-size:16px;font-weight:700;line-height:1.4;color:var(--accent);margin-top:8px;letter-spacing:.1em}
.panel p,.q p{max-width:34em}
.gift{background:var(--tint);padding:10px 12px;font-weight:500}
.page-head{display:grid;gap:4px;padding-top:6px;scroll-margin-top:140px}
.qs{display:grid;gap:12px}
.q{background:var(--card);border:1px solid var(--rule);padding:16px;display:grid;gap:10px;scroll-margin-top:140px;min-width:0}
.q h3{font-size:18px;font-weight:700;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{
  display:flex;gap:10px;align-items:flex-start;width:100%;min-height:48px;text-align:left;cursor:pointer;
  padding:11px 12px;border:1px solid var(--text);border-radius:2px;
  background:var(--card);color:var(--text);font:500 16px/1.5 var(--f-body);
}
.opt:disabled{color:var(--text);cursor:default}
.opt .mk{flex:none;width:20px;height:20px;margin-top:2px;border:1px solid var(--text);border-radius:50%;background:var(--card)}
.opt span:last-child{min-width:0}
.opt.is-right{border-color:var(--good);background:var(--good-bg)}
.opt.is-picked .mk{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--card)}
.opt.is-dim{opacity:.55}
.fb{display:grid;gap:10px}
.fb:empty{display:none}
.fb>*{animation:up .26s ease-out}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.verdict{font:700 17px/1.4 var(--f-disp);color:var(--accent)}
.note{background:var(--tint);padding:12px;display:grid;gap:4px;font-size:15px}
.memo{border-block:1px solid var(--text);padding:12px 2px;display:grid;gap:3px}
.memo b{font:500 11px/1.3 var(--f-body);letter-spacing:.22em;color:var(--accent)}
.memo span{font:700 16px/1.6 var(--f-disp)}
.next-box{display:grid;gap:6px}
.btn{
  width:100%;min-height:52px;padding:10px 14px;border:0;border-radius:2px;cursor:pointer;
  font:700 17px/1.35 var(--f-disp);letter-spacing:.1em;
  background:var(--accent);color:var(--on-accent);
}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.fine{font-size:13px;line-height:1.6;color:var(--text-soft)}

/* 雙 11 抵用券 */
.voucher{background:var(--p-green);color:var(--p-cream);padding:24px 16px 18px;display:grid;gap:8px;justify-items:center;text-align:center;outline:1px solid var(--p-gold);outline-offset:-7px}
.v-brand{font:500 10px/1.4 var(--f-disp);letter-spacing:.3em;color:var(--p-glow)}
.v-amt{font:700 62px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.v-amt small{font-size:26px;vertical-align:.95em;margin-right:3px}
.v-name{font:900 20px/1.3 var(--f-disp);letter-spacing:.3em;padding-left:.3em}
.v-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;width:100%;border-top:1px dashed var(--p-gold);padding-top:12px;margin-top:6px}
.v-meta dt{font-size:11px;line-height:1.4;letter-spacing:.14em;color:var(--p-glow)}
.v-meta dd{font:700 14px/1.4 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.steps{padding-left:1.4em;display:grid;gap:4px;font-size:15px}
.line-id{font-size:14px;color:var(--text-soft)}
.line-id b{color:var(--text);font-weight:500;user-select:all}

.face.pop{animation:pop .5s ease-out}
@keyframes pop{40%{transform:scale(1.14)}}

@media (prefers-reduced-motion: reduce){
  .fb>*,.face.pop,.node.is-cur .ring{animation:none}
  .petal,.meter i{transition:none}
}
</style>

<script>
(function(){
'use strict';

/* ───── 題庫：要改題目只動這一段（ok:true 是後台正確答案） ───── */

 {label:'第一頁',title:'讀懂肌膚的小訊號',

var PROMO={amount:100,expire:'2026.12.31',end:new Date(2026,11,31,23,59,59),key:'yc-1111-voucher',line:'https://lin.ee/4CDLLkE',lineId:'@320humwr'};

var QS=[],PAGE_OF=[],PAGE_START=[];

function $(id){return document.getElementById(id)}
function f1(n){return n.toFixed(1)}

var S,pathEl,pathLen=0,curT=0,facing=1,walkId=0,NODE_T=[];

  var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);

/* ───── 抵用券 ───── */
var VOUCHER=null;
function promoOn(){return new Date()<=PROMO.end}
function getVoucher(){
  if(VOUCHER)return VOUCHER;
  try{
    var v=JSON.parse(localStorage.getItem(PROMO.key));
    if(v&&/^YC1111-[A-Z0-9]{5}$/.test(v.code)&&/^\d{4}\.\d{2}\.\d{2}$/.test(v.date)){VOUCHER={code:v.code,date:v.date}}
  }catch(e){}
  return VOUCHER;
}
function makeVoucher(){
  if(getVoucher())return VOUCHER;
  var ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',c='',d=new Date();
  for(var i=0;i<5;i++){c+=ch.charAt(Math.floor(Math.random()*ch.length))}
  function p2(n){return (n<10?'0':'')+n}
  VOUCHER={code:'YC1111-'+c,date:d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())};
  try{localStorage.setItem(PROMO.key,JSON.stringify(VOUCHER))}catch(e){}
  return VOUCHER;
}
function voucherHTML(v){
  return '<div class="voucher" role="group" aria-label="$'+PROMO.amount+' 課程抵用券">'+
      '<span class="v-brand">YU CHUN SKIN CARE · 雙 11</span>'+
      '<p class="v-amt"><small>$</small>'+PROMO.amount+'</p>'+
      '<p class="v-name">課程抵用券</p>'+
      '<dl class="v-meta"><div><dt>使用期限</dt><dd>'+PROMO.expire+'</dd></div>'+
      '<div><dt>券號</dt><dd>'+v.code+'</dd></div><div><dt>完成日</dt><dd>'+v.date+'</dd></div></dl>'+
    '</div>'+
    '<h3 class="sub">怎麼使用</h3>'+
    '<ol class="steps"><li>把這張抵用券截圖存下來。</li><li>傳到癒淳官方 LINE，或來店時出示截圖。</li><li>預約課程時告知使用，結帳折抵 $'+PROMO.amount+'。</li></ol>'+
    '<a class="btn" href="'+PROMO.line+'" target="_blank" rel="noopener">開啟官方 LINE</a>'+
    '<p class="line-id">連結打不開的話，在 LINE 搜尋 ID：<b>'+PROMO.lineId+'</b></p>'+
    '<p class="fine">完成 '+TOTAL+' 題即可獲得。每人限用一次，使用期限至 '+PROMO.expire+'。</p>';
}

function decor(rnd,pts,avoid){

  for(var n=0;n<320&&placed.length<13;n++){
    var x=16+rnd()*308,y=150+rnd()*134;
    if(!far(pts,x,y,23)||!far(avoid,x,y,26)||!far(placed,x,y,25))continue;
    placed.push([x,y]);
    var k=rnd();

      var a=k<.4?'c-pink':'c-cream',b=k<.4?'c-pink2':'c-pink';

/* 下排 3 站是第一頁，上排 4 站是第二頁 */
function computeNodeT(){
  var N=800,pts=[],k;
  for(k=0;k<=N;k++){pts.push(pathEl.getPointAtLength(pathLen*k/N))}
  var rows=[],lo=[80,150,220],hi=[246,198,150,104],i;
  for(i=0;i<TOTAL;i++){
    var pi=PAGE_OF[i],n=i-PAGE_START[pi],len=PAGES[pi].qs.length;
    var xs=pi===0?lo:hi,x=xs.length===len?xs[n]:(pi===0?60+n*180/Math.max(1,len-1):250-n*150/Math.max(1,len-1));
    rows.push([x,pi===0?0:1]);
  }
  return rows.map(function(g){
    var best=0,bd=1e9;
    for(k=0;k<=N;k++){
      var t=k/N,p=pts[k];
      var ok=g[1]===0?(t<0.38&&p.y>245):(t>0.38&&t<0.82&&p.y>185&&p.y<225);
      if(!ok)continue;
      var d=Math.abs(p.x-g[0]);if(d<bd){bd=d;best=t}
    }
    return best;
  });
}

function restT(){
  if(S.done)return 1;
  var last=-1;for(var i=0;i<TOTAL;i++){if(answered(i))last=i}
  return last<0?0:NODE_T[last];
}
function setWalker(t,phase,dir){
  curT=t;
  var at=pathLen*t,p=pathEl.getPointAtLength(at),q=pathEl.getPointAtLength(Math.min(pathLen,at+5));
  if(dir&&Math.abs(q.x-p.x)>0.4)facing=(q.x>p.x?1:-1)*dir;
  var w=$('walker');
  w.setAttribute('transform','translate('+p.x.toFixed(2)+' '+(p.y-3).toFixed(2)+') scale('+facing+' 1)');
  $('prog').style.strokeDasharray=at.toFixed(1)+' '+(pathLen+20).toFixed(1);
  var s=phase?2.7*Math.sin(phase):0,A=w.querySelectorAll('.la'),B=w.querySelectorAll('.lb');
  for(var i=0;i<A.length;i++){
    A[i].setAttribute('x2',(+A[i].getAttribute('x1')+s).toFixed(2));
    B[i].setAttribute('x2',(+B[i].getAttribute('x1')-s).toFixed(2));
  }
}
function walkTo(tTo){
  var id=++walkId,from=curT,dist=Math.abs(tTo-from),dir=tTo>=from?1:-1;
  if(reduce||dist<0.001){setWalker(tTo,0,dir);return}
  var dur=600+2600*dist,t0=null;
  function step(ts){
    if(id!==walkId)return;
    if(t0===null)t0=ts;
    var k=Math.min(1,(ts-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    if(k<1){setWalker(from+(tTo-from)*e,(ts-t0)/70+0.01,dir);requestAnimationFrame(step)}
    else{setWalker(tTo,0,dir)}
  }
  requestAnimationFrame(step);
}
function updateNodes(){
  var g=$('nodes').querySelectorAll('.node'),cur=-1,i;
  if(!S.done){for(i=0;i<TOTAL;i++){if(PAGE_OF[i]===S.page&&!answered(i)){cur=i;break}}}
  for(i=0;i<g.length;i++){
    g[i].setAttribute('class','node'+(answered(i)?' is-done':'')+(i===cur?' is-cur':''));
  }
  var c=count();
  $('scene').setAttribute('aria-label','養膚小路：從起點走到店門口，沿路有 '+TOTAL+' 個養膚標記，已點亮 '+c+' 個');
}

function updateNext(){

function renderContent(){
  var c=$('content'),pg=PAGES[S.page],h='',i;
  if(promoOn()&&getVoucher()&&!S.replay&&!S.done&&S.page===0&&count()===0){
    c.innerHTML='<section class="panel"><p class="eyebrow">已領取</p><h2>妳的 $'+PROMO.amount+' 課程抵用券</h2>'+
      voucherHTML(getVoucher())+
      '<button class="btn btn-ghost" id="again" type="button">再練習一次</button>'+
      '<p class="fine">再練習一次不會產生新的抵用券。</p></section>';
    $('again').addEventListener('click',function(){S.replay=true;renderContent()});
    return;
  }
  if(S.page===0){
    h+='<section class="panel"><h2>'+INTRO.head+'</h2><p>'+INTRO.body+'</p>'+
      (promoOn()?'<p class="gift">完成 '+TOTAL+' 題，送 $'+PROMO.amount+' 課程抵用券（使用期限 '+PROMO.expire+'）。</p>':'')+'</section>';
  }
  h+='<div class="page-head" id="pageHead"><p class="eyebrow">'+pg.label+' · '+pg.qs.length+' 題</p><h2 tabindex="-1">'+pg.title+'</h2></div><div class="qs">';
  for(i=0;i<TOTAL;i++){if(PAGE_OF[i]===S.page)h+=qHTML(i)}
  h+='</div><p class="memo"><b>YUCHUN 養膚筆記</b><span>'+pg.memo+'</span></p>'+
    '<div class="next-box" id="nextBox"><button class="btn" id="next" type="button">'+pg.btn+'</button><p class="fine" id="hint"></p></div>'+
    '<section class="panel" id="reward" hidden></section>';
  c.innerHTML=h;
  for(i=0;i<TOTAL;i++){if(PAGE_OF[i]===S.page&&answered(i))showAnswer(i)}
  var opts=c.querySelectorAll('.opt');
  for(i=0;i<opts.length;i++){
    opts[i].addEventListener('click',function(){answer(+this.getAttribute('data-q'),+this.getAttribute('data-o'))});
  }
  $('next').addEventListener('click',nextStep);
  updateNext();
  if(S.done)showReward(false);
}
function showReward(move){
  var r=$('reward');
  $('nextBox').hidden=true;
  r.innerHTML=rewardHTML();r.hidden=false;
  $('again').addEventListener('click',restart);
  if(move){
    r.scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'});
    r.querySelector('h2').focus({preventScroll:true});
  }
}
function nextStep(){
  if(pageLeft(S.page)>0)return;
  if(S.page<PAGES.length-1){
    S.page++;renderContent();updateTop();updateNodes();
    $('pageHead').scrollIntoView({block:'start'});
    $('pageHead').querySelector('h2').focus({preventScroll:true});
  }else{
    S.done=true;updateNodes();showReward(true);walkTo(1);
  }
}

/* ───── 啟動 ───── */
function restore(d){
  var s=fresh();
  if(!d||typeof d!=='object'||!d.answers||typeof d.answers!=='object')return s;
  if(Array.isArray(d.order)&&d.order.length===TOTAL){
    var good=d.order.every(function(o,i){
      return Array.isArray(o)&&o.length===QS[i].opts.length&&o.slice().sort().join()===QS[i].opts.map(function(_,k){return k}).join();
    });
    if(good)s.order=d.order;
  }
  for(var i=0;i<TOTAL;i++){
    var a=d.answers[i];
    if(typeof a==='number'&&a>=0&&a<QS[i].opts.length&&a===Math.floor(a))s.answers[i]=a;
  }
  s.replay=!!d.replay;
  S=s;
  s.page=(d.page===1&&pageLeft(0)===0)?1:0;
  s.done=!!d.done&&count()===TOTAL;
  if(s.done)s.page=PAGES.length-1;
  return s;
}
function start(data){
  S=fresh();S=restore(data);
  buildTop();renderScene();
  updateTop();updateNodes();setWalker(restT(),0);
  renderContent();
}
try{
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){
    window.claude.hot.snapshot(function(){return JSON.parse(JSON.stringify(S))});
  }
}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready){window.claude.hot.ready(start)}
else{start((window.claude&&window.claude.hot&&window.claude.hot.data)||{})}
})();
</script>
